name: Catraca de acessibilidade

# ============================== POR QUE EXISTE ==============================
#
# Em 14/11/2026 o projeto tinha 92 campos de formulario cujo `<Label>` nao
# estava associado a controle nenhum: leitor de tela anunciava o campo sem
# nome, e clicar no rotulo nao focava o campo. O pior caso era `patients/new`,
# com 21 — o formulario que coleta dado pessoal sensivel sob LGPD.
#
# Nao era desconhecimento: o padrao certo aparecia quinze linhas abaixo do
# errado, no mesmo arquivo. O padrao errado e mais curto de escrever, entao
# volta sozinho se ninguem segurar.
#
# A catraca nao proibe: `apps/web/a11y-permitidos.json` lista as 9 ocorrencias
# legitimas que sobraram, cada uma com o motivo escrito, e o job falha so no
# que for NOVO. Ela tambem falha quando uma permissao SOBRA, para a lista nao
# envelhecer virando desculpa.
#
# Provado contra a condicao antiga antes de entrar: reintroduzindo o defeito em
# `laboratory/page.tsx`, a catraca acusa e sai com codigo 1. Conferencia que
# nunca acusou nada nao prova que funciona.
#
# ⚠️ ESTE E O UNICO WORKFLOW QUE RODA EM PUSH. Os outros tres
#    (expurgo-fotos, manter-acordado, rag-sync) sao tarefas agendadas contra a
#    API em producao. Ou seja: hoje os 1.213 testes de `apps/api`, o
#    `tsc --noEmit` e o `next build` NAO rodam em nenhum lugar automaticamente.
#    Pendurar esses passos aqui e o proximo passo natural.

on:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - '.github/workflows/acessibilidade.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/acessibilidade.yml'
  workflow_dispatch:

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catraca:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # corepack respeita o campo `packageManager` da raiz (pnpm@11.2.2). Fixar
      # a versao importa: a arvore de `node_modules` guarda o
      # virtual-store-dir-max-length de quem a criou, e outra versao recusa
      # instalar por cima.
      - name: Preparar pnpm
        run: corepack enable

      # 22 e nao 20. O `engines` da raiz pede node >=20, mas isso e sobre o
      # app; quem manda aqui e o pnpm 11.2.2 do campo `packageManager`, que
      # exige node >=22.13. Com o 20 o passo morria em `node:sqlite` —
      # ERR_UNKNOWN_BUILTIN_MODULE — ainda dentro do setup-node, porque
      # `cache: pnpm` ja chama o pnpm para descobrir o diretorio do store.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # So as dependencias de apps/web. Instalar o workspace inteiro traria o
      # puppeteer da API, que baixa um Chromium a cada execucao sem que nada
      # aqui o use.
      - name: Instalar dependencias do front
        run: pnpm install --frozen-lockfile --filter @nutri-performance/web...

      - name: Catraca
        working-directory: apps/web
        run: pnpm a11y
