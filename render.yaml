services:
  - type: web
    # ATENCAO: o servico em producao foi criado a mao pelo painel do Render, nao
    # a partir deste blueprint. Este arquivo documenta a configuracao esperada;
    # a fonte de verdade e o painel. O nome precisa bater com o servico real
    # (https://nutriperformance-clinical.onrender.com) — ja esteve como
    # `nutriperformance-api`, host que nunca existiu, e essa divergencia levou a
    # um diagnostico errado de "servico suspenso" durante um deploy que estava
    # perfeito. Se um dia este blueprint for sincronizado, mudar `name` faz o
    # Render CRIAR um servico novo em vez de renomear o existente.
    name: nutriperformance-clinical
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Plano gratuito: o serviço hiberna após ~15 min sem tráfego e o próximo
    # request paga ~50s de cold start. O código foi adaptado para isso:
    #  - api-client.ts refaz a requisição com orçamento longo em vez de estourar
    #    no timeout de 30s (que era erro garantido no primeiro acesso do dia);
    #  - warmUp() dispara /health no carregamento do app, então a instância
    #    acorda enquanto o usuário faz login;
    #  - POST /assistant/sync permite disparar o sync do RAG por cron externo,
    #    já que o @Cron in-process não roda com a instância dormindo.
    plan: free
    # O banco fica no Supabase sa-east-1 (São Paulo). O Render não tem região
    # no Brasil; virginia (us-east) é a mais próxima — oregon (us-west) somava
    # uma travessia de continente em cada query.
    region: virginia
    healthCheckPath: /health
    envVars:
      # OBRIGATÓRIA: com NODE_ENV != 'production' o TypeORM liga `synchronize`
      # e reescreve o schema de produção (app.module.ts: synchronize: !isProduction).
      - key: NODE_ENV
        value: production

      # ---- Banco (Supabase sa-east-1) ----------------------------------------
      # Usar o pooler de SESSÃO (5432). O de transação (6543) quebra prepared
      # statements no TypeORM. DB_SSL=true é obrigatório com o pooler.
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        sync: false
      # Só usadas se DATABASE_URL estiver ausente (fallback host/porta):
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false

      # ---- Auth (Supabase) ---------------------------------------------------
      # SUPABASE_URL monta o JWKS de verificação do token no JwtAuthGuard.
      - key: SUPABASE_URL
        sync: false
      # Fallback HS256 para projetos legados; o caminho atual é o JWKS acima.
      - key: SUPABASE_JWT_SECRET
        sync: false

      # ---- Dados clínicos ----------------------------------------------------
      # Trocar qualquer uma torna ilegíveis os dados de paciente já gravados.
      - key: ENCRYPTION_KEY
        sync: false
      - key: CPF_SALT
        sync: false

      # ---- Integrações -------------------------------------------------------
      # API_URL: URL pública desta API.
      - key: API_URL
        sync: false
      # FRONTEND_URL entra na allowlist de CORS em main.ts.
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # Segredo compartilhado com o workflow .github/workflows/rag-sync.yml,
      # que autentica POST /assistant/sync. Sem ele a rota fica FECHADA (o
      # CronSecretGuard falha fechado) — o sync simplesmente não roda.
      # Gerar com: openssl rand -hex 32
      - key: CRON_SECRET
        sync: false

      # ---- Opcionais ---------------------------------------------------------
      # Sem USDA_API_KEY o /foods/usda cai em DEMO_KEY (~30 req/h).
      - key: USDA_API_KEY
        sync: false
      # Sentry só inicializa se o DSN existir.
      - key: SENTRY_DSN
        sync: false

# Removidas: DB_SYNC, JWT_SECRET, JWT_EXPIRY e SUPABASE_SERVICE_ROLE_KEY.
# Nenhuma é lida pelo código hoje. DB_SYNC era a mais perigosa: sugeria
# controlar o `synchronize` do TypeORM, que na verdade depende só de NODE_ENV.
# PORT é injetada pelo Render e lida em main.ts — não declarar aqui.
