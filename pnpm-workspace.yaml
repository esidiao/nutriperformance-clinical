packages:
  - 'apps/*'
allowBuilds:
  '@nestjs/core': true
  bcrypt: set this to true or false
  core-js: set this to true or false
  puppeteer: true
  sharp: set this to true or false

# Correções de vulnerabilidades high/critical em dependências transitivas.
# (No pnpm 11 os overrides moraram aqui — em package.json eles são ignorados
# com um WARN, sem erro, então uma correção posta lá não teria efeito nenhum.)
#
# Só entram bumps DENTRO do mesmo major já instalado. O que exige troca de
# major fica de fora de propósito e é upgrade planejado, não override silencioso:
#   - extract-zip: o advisory pede >=2.0.2, mas a última release publicada é a
#     2.0.1 — não há correção disponível (puxado por puppeteer). É o único
#     high que sobra, e não sobra por escolha.
#
# Em 2026-08-29 os três majors que ficavam de fora foram feitos e VERIFICADOS,
# não apenas bumpados (ver relatório do ciclo):
#   - jspdf 2.5.2 → 4.2.1 + jspdf-autotable 3.8 → 5.0: a prescrição renderizada
#     saiu byte-a-byte idêntica à da versão anterior (só /Producer e
#     /CreationDate mudam). Levou 2 critical + 6 high embora.
#   - tmp 0.0.33 → 0.2.7: `nest build` roda igual (é dev-only, @nestjs/cli).
#   - sharp 0.34.5 → 0.35.4: decode → resize → encode webp exercitado direto,
#     que é o que o otimizador de imagem do Next faz.
#
# `tar` saiu desta lista em 2026-08-29: o único caminho até ele era
# bcrypt > @mapbox/node-pre-gyp > tar, e o bcrypt foi REMOVIDO da API — não
# tinha um único import em apps/api/src (a senha é do Supabase Auth). Com ele
# foram embora 1 critical + 11 high transitivos e um build nativo do Docker.
overrides:
  postcss@<8.5.18: ^8.5.18
  ws@<8.21.0: ^8.21.0
  form-data@<4.0.6: ^4.0.6
  lodash@<4.17.24: ^4.17.24
  picomatch@>=4.0.0 <4.0.4: ^4.0.4
  js-yaml@>=4.0.0 <4.3.0: ^4.3.0
  ip-address@<10.3.1: ^10.3.1
  fast-uri@<3.1.4: ^3.1.4
  glob@>=10.0.0 <10.5.0: ^10.5.0
  multer@<2.2.0: ^2.2.0
  # Adicionados em 2026-08-29 — todos patch/minor dentro do major instalado:
  brace-expansion@>=1.0.0 <1.1.18: ^1.1.18
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  js-yaml@>=3.0.0 <3.15.1: ^3.15.1
  tmp@<0.2.6: ^0.2.6
  sharp@<0.35.0: ^0.35.0
